<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Recolor pipeline</title>
  <desc>Four stages: extract colors from the slide and theme, cluster them into hue families, map template families onto deck families with lightness derivation, then write colors back into every node.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="15" font-weight="600" fill="#111827">How a recolor request is processed</text>

  <g>
    <rect x="16" y="46" width="192" height="96" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <circle cx="42" cy="70" r="11" fill="#1D4ED8"/>
    <text x="42" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="112" y="70" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">Extract</text>
    <text x="112" y="92" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">Current slide first,</text>
    <text x="112" y="108" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">theme colors as backup</text>
    <text x="112" y="126" font-size="11" fill="#6B7280" text-anchor="middle" dominant-baseline="central">weighted by area and role</text>
  </g>
  <path d="M212 94 L236 94" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="240" y="46" width="192" height="96" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <circle cx="266" cy="70" r="11" fill="#1D4ED8"/>
    <text x="266" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="336" y="70" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">Cluster</text>
    <text x="336" y="92" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">Split neutrals from chroma,</text>
    <text x="336" y="108" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">group hues into families</text>
    <text x="336" y="126" font-size="11" fill="#6B7280" text-anchor="middle" dominant-baseline="central">circular mean, 12 degree bins</text>
  </g>
  <path d="M436 94 L460 94" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="464" y="46" width="192" height="96" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
    <circle cx="490" cy="70" r="11" fill="#047857"/>
    <text x="490" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="560" y="70" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle" dominant-baseline="central">Map</text>
    <text x="560" y="92" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">Primary onto primary,</text>
    <text x="560" y="108" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">then derive lightness</text>
    <text x="560" y="126" font-size="11" fill="#6B7280" text-anchor="middle" dominant-baseline="central">inside each family</text>
  </g>
  <path d="M660 94 L684 94" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="688" y="46" width="196" height="96" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
    <circle cx="714" cy="70" r="11" fill="#047857"/>
    <text x="714" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
    <text x="786" y="70" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle" dominant-baseline="central">Write back</text>
    <text x="786" y="92" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">Every gradient stop, line,</text>
    <text x="786" y="108" font-size="11.5" fill="#374151" text-anchor="middle" dominant-baseline="central">run, cell, chart series</text>
    <text x="786" y="126" font-size="11" fill="#6B7280" text-anchor="middle" dominant-baseline="central">nothing else is touched</text>
  </g>

  <rect x="16" y="164" width="868" height="58" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="32" y="186" font-size="12" font-weight="600" fill="#111827">Nothing is flattened</text>
  <text x="32" y="205" font-size="11.5" fill="#4B5563">The brightest member of a family stays the brightest, outlines stay darker than fills, and gradient direction is preserved.</text>
</svg>
